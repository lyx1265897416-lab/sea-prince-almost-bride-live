const subs = $('subs');
function showSub(c, who){ if (!c){ subs.innerHTML = ''; subs.classList.remove('you'); return; } subs.classList.toggle('you', who === 'you');
  subs.innerHTML = (who ? `<div class="who">${who === 'you' ? 'You' : esc(who)}</div>` : '') + (c.en ? `<div class="en">${esc(c.en)}</div>` : '') + (c.zh ? `<div class="zh">${esc(c.zh)}</div>` : ''); }
function placeSubs(){ subs.style.bottom = document.body.classList.contains('choosing') ? ($('sheet').offsetHeight + 14) + 'px' : ''; }
addEventListener('resize', placeSubs);

// 一个画面切到另一个：新的先盖上，再停旧的
function show(el){ const old = front; front = el; el.classList.add('on'); const retire = () => { if (old !== front){ old.classList.remove('on'); old.pause(); } }; requestAnimationFrame(retire); setTimeout(retire, 60); }
function spare(){ return pool.find(v => v !== front && !v.dataset.keep) || pool.find(v => v !== front); }
function load(el, src, loop){ el.loop = !!loop; el.muted = !!loop; el.preload = 'auto'; el._tl = Date.now(); el._dl = null; el.src = src; el.load(); }
// 缓冲够了才开播（11-05 Vicky：网页播放特别卡；同三真四假）：真的缓冲到前面 need 秒或到片尾才算够。不信 readyState 4：Chrome 的“能播完”是估的，
// 第 1 段、第 2 段和待机循环同时下载、抢一条带宽时，第 1 段没下完就开播，中途会停。
// 只到 readyState 3 的（iPhone 上暂停时不预载）等满 wait 秒也放行，免得一直不开播
const srcOf = s => [s.url].filter(Boolean);
function pick(v, s){ return s.url ? (v.dataset.started ? v.dataset.src : s.url) : null; }
// 后台慢放（11-05）：浏览器只把暂停的视频缓冲到 13 秒左右就停（networkState 1），开播后才续传，续传慢就卡。
// 等着的时候让这一段静音、0.0625 倍速在后台“播”，浏览器就一直下到结尾；真开播时退回 0 秒、恢复正常速度和声音。
function warm(v){ if (!v.src || v.dataset.started || !v.paused || v.readyState < 1) return; const b = v.buffered; if (v.duration > 0 && b.length && b.end(b.length - 1) >= v.duration - 0.3) return;
  v.dataset.warm = '1'; v.muted = true; try { v.playbackRate = 0.0625; } catch (e) {} v.play().catch(() => {}); }
function bufEta(v){ const b = v.buffered, end = b.length ? b.end(b.length - 1) : 0; if (!(v.duration > 0) || !end) return Infinity; if (end >= v.duration - 0.3) return 0;
  if (!v._b0 || v._bsrc !== v.src){ v._b0 = Date.now(); v._e0 = end; v._bsrc = v.src; return Infinity; } const dt = (Date.now() - v._b0) / 1000, avg = end / Math.max(1, (Date.now() - v._tl) / 1000), rate = Math.min((end - v._e0) / dt, avg);
  return dt > 1.5 && rate > 0 ? (v.duration - end) / rate : Infinity; }  // 还要几秒下完（按这一段实测的缓冲速度；11-05 取较慢的那个：从开始加载算的平均速度含首包等待。Vivix CDN 先快后慢时只看后者会估得太乐观，Meet-me 实测两段之间停了 11.5 秒）
function enough(v, need, wait){ const b = v.buffered, end = b.length ? b.end(b.length - 1) : 0;
  if (v.duration > 0 && end >= Math.min(v.duration - 0.3, v.currentTime + need)) return true;
  if (v.readyState >= 3){ const now = Date.now(); if (!v._r3 || v._r3src !== v.src){ v._r3 = now; v._r3src = v.src; } return now - v._r3 >= (wait || 10000); } return false; }

let sid = null, next = null, round = 0, busy = false;
async function api(path, body){ await relayReady; const r = await fetch(API + path, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(Object.assign({k: K}, body)) : undefined}); const raw = await r.text(); let j; try { j = JSON.parse(raw); } catch (e){ throw new Error(T('The server hiccuped. Please send again.', '服务刚才没响应，请再发一次')); } if (!r.ok) throw new Error(j.err || r.status); return j; }

(K ? relayReady.then(() => fetch(`${API}/api/ping?k=${encodeURIComponent(K)}`)) : Promise.reject(new Error('nokey'))).then(r => r.json()).then(j => setChip(!j.ok ? '<b>Wrong key</b> · open this page from the test link' : j.vivix_balance === 'insufficient' ? '<b>Vivix balance low</b> · the last submit was rejected (10005); top up the Vivix workspace first' : `<b>Live generation connected</b> · ${esc(j.model)} · ${esc(MODE)} in parallel · director ${esc((j.director || '').split('/').pop())}`))
  .catch(e => setChip(e.message === 'nokey' ? '<b>Preview</b> · opening only; live scenes need the test link with a key' : '<b>Live generation offline</b> · the relay on the Mac is not reachable right now'));

// 开场
const ov = pool[1]; load(ov, SRC('media/OPEN.mp4')); const idle = pool[2]; load(idle, SRC('media/IDLE0.mp4'), true);
if (PAGES) [[ov, 'media/OPEN.mp4'], [idle, 'media/IDLE0.mp4']].forEach(([v, p]) => v.addEventListener('error', () => { if (!v.src.endsWith(p)) { v.src = p; v.load(); } }));
async function startSession(){ if (!K){ next = PREVIEW_NEXT; return; } const j = await api('/api/session', {mode: MODE}); sid = j.sid; next = j.next; round = 0; }
$('startBtn').onclick = async () => {
  $('startCard').hidden = true; setMode('playing');
  [pool[0], idle].forEach(v => { const p = v.play(); if (p) p.then(() => { if (v !== front) v.pause(); }).catch(() => {}); });  // 在这次点击里解锁
  wait.play().then(() => { if (!waitTarget) wait.pause(); }).catch(() => {});
  startSession().catch(e => setChip('<b>Could not start</b> · ' + esc(e.message)));
  playOpening();
};
let replayFn = null;
function playOpening(){
  showSub(null); ov.currentTime = 0; ov.muted = false; ov.loop = false;
  RT.begin({key: 'OPEN', parts: [{v: ov, d: 94.5}]}); replayFn = playOpening;
  const go = () => ov.play().then(() => show(ov)).catch(() => { show(ov); toast(T('Tap the screen to start', '点一下画面开始')); });
  if (enough(ov, 8, 6000)) go();
  else {  // 先在点击里起播再停住（保住播放权限），缓冲够了再接着播
    ov.play().then(() => { if (!enough(ov, 8, 6000)){ ov.pause(); show(ov); toast(T('Loading the opening…', '开场片缓冲中…')); const t = setInterval(() => { if (enough(ov, 8, 6000)){ clearInterval(t); go(); } }, 250); } else show(ov); }).catch(() => { show(ov); toast(T('Tap the screen to start', '点一下画面开始')); });
  }
  ov.ontimeupdate = () => { const t = ov.currentTime; const c = OPEN_CUES.find(q => t >= q.s && t <= q.e); showSub(c || null, c && (c.who === 'Her' ? T('Her', '她') : c.who)); };
  ov.onended = () => { RT.done('OPEN'); RT.clear(); ov.ontimeupdate = null; idle.currentTime = 0; idle.play().catch(() => {}); show(idle); openChoice(); };
}
$('mRestart').onclick = () => { $('menu').hidden = true; replayFn = null; closeChoice(); $('liveWait').hidden = true; liveRun++; busy = false; setMode('playing'); startSession().catch(() => {}); load(idle, SRC('media/IDLE0.mp4'), true); playOpening(); };
$('menuBtn').onclick = () => { const m = $('menu'); m.hidden = !m.hidden; };
$('mLang').onclick = () => { lang = lang === 'en' ? 'zh' : 'en'; Q.set('lang', lang); history.replaceState(null, '', '?' + Q.toString()); applyLang(); $('menu').hidden = true; };

// 选择点：导演层上一轮给的两个选项 + 输入框
const opt = o => `<span class="en">${esc(o.en)}</span><span class="zh">${esc(o.zh)}</span>`;
async function openChoice(){
  setMode('choosing'); $('shade').classList.add('deep'); waitMusic(true); RT.clear();
  $('replayBtn').hidden = !replayFn; $('replayBtn').textContent = T('↺ Replay', '↺ 重看这一段');
  for (let i = 0; i < 100 && !next; i++) await new Promise(r => setTimeout(r, 100));
  if (!next){ setChip('<b>No options received</b> · the local relay did not respond'); return; }
  fillChoice();
  $('optA').onclick = () => liveRound('option', 'A', next.A); $('optB').onclick = () => liveRound('option', 'B', next.B);
  $('sayIn').value = ''; $('sayBtn').disabled = false;
  setTimeout(() => { $('sheet').classList.add('show'); placeSubs(); }, 150);
}
function fillChoice(){
  $('rno').textContent = T(`Scene ${round + 1}`, `第 ${round + 1} 幕`);
  $('cue').innerHTML = `${esc(next.cue.en)}<span class="zh">${esc(next.cue.zh)}</span>`;
  $('optA').innerHTML = opt(next.A); $('optB').innerHTML = opt(next.B);
}
$('replayBtn').onclick = () => { if (!replayFn || busy) return; closeChoice(); $('shade').classList.remove('deep'); waitMusic(false); setMode('playing'); replayFn(); };
function closeChoice(){ $('sheet').classList.remove('show'); subs.style.bottom = ''; $('shade').classList.remove('deep'); }
$('say').addEventListener('submit', e => { e.preventDefault(); const raw = $('sayIn').value.trim(); if (!raw || busy) return; liveRound('free', null, {zh: raw, en: raw}); });

// 一轮：发出去 → 等导演层和两段生成 → 两段都好、都缓冲好 → 一次连续播完 → 下一个选择点
let liveRun = 0;
async function liveRound(kind, choice, said){
  if (!K){ toast(T('Live scenes need the test link with a key', '实时生成需要带口令的测试链接')); return; }
  if (busy) return; busy = true; const my = ++liveRun, t0 = Date.now(); let r = null, rid = null;
  closeChoice(); setMode('waiting'); waitMusic(true); showSub(null);
  const herLine = lang === 'en' ? (said.en || said.zh) : (said.zh || said.en);
  $('lwH').textContent = T('You: ', '你：') + herLine;
  const phase = () => !r ? T('Sending…', '发送中…') : r.status === 'keyframe' ? T('Setting up the next moment…', '正在准备下一刻的画面…') : r.status === 'submitted' ? (kind === 'option' ? T('Reading the storyboard for this choice…', '读取这个选项预先写好的分镜…') : T('Writing his reply…', '导演层在写他的回话…')) : r.status === 'error' ? T('Generation failed', '生成失败')
    : (r.segs && r.segs[0] && r.segs[0].url && r.segs[1] && !r.segs[1].url) ? T(`Part 1 ready · part 2 in ~${(r.segs[1].eta_left || 0).toFixed(0)} s, timing the start so both play straight through`, `第 1 段好了 · 第 2 段约 ${(r.segs[1].eta_left || 0).toFixed(0)} 秒后好，算好时间开播，两段接着播`)
    : T(`Generating both parts at once (${r.mode.replace('+', ' s + ')} s) · ${(r.segs || []).filter(s => s.url).length}/2 ready`, `两段同时生成中（${r.mode.replace('+', ' 秒 + ')} 秒）· 已完成 ${(r.segs || []).filter(s => s.url).length}/2`);
  const hold = (label, cond) => new Promise(res => { $('liveWait').hidden = false; (function f(){ if (my !== liveRun) return; $('lwT').textContent = ((Date.now() - t0) / 1000).toFixed(1); $('lwS').textContent = label || phase(); if (cond()){ res(); } else setTimeout(f, 100); })(); });
  try { rid = (await api('/api/round', {sid, kind, choice, input: kind === 'free' ? said.zh : undefined})).id; }
  catch (e){ $('liveWait').hidden = true; busy = false; setChip('<b>Not sent</b> · ' + esc(e.message)); toast(T('Live generation unavailable', '实时生成不可用')); openChoice(); if (kind === 'free') $('sayIn').value = said.zh; return; }
  const V = [spare()]; V[0].dataset.keep = 1; V.push(spare()); delete V[0].dataset.keep; V.forEach(v => delete v.dataset.started);
  const poll = setInterval(async () => {
    try { r = await api(`/api/round/${rid}?k=${encodeURIComponent(K)}`); } catch (e) {}
    if (r && r.segs) r.segs.forEach((s, i) => { const u = pick(V[i], s); if (u && V[i].dataset.src !== u){ V[i].dataset.src = u; load(V[i], u); } warm(V[i]); const f = s.url + JSON.stringify(s.flip || []); if (s.url && V[i].dataset.flip !== f){ V[i].dataset.flip = f; RT.flip(V[i], s.flip); } });  // 一到就预载；V3.6 左右对调的镜头由中转标出（flip），播到那几秒水平镜像
  }, 500);
  // V1.5 提速：第 1 段不等第 2 段出片——按第 2 段的预计出片时间（中转给的 eta_left）倒推开播，第 1 段播完正好接上第 2 段
  const LOCAL = location.hostname === '127.0.0.1', M = LOCAL ? 1.5 : 3.0;  // 轮询、隧道延迟和第 2 段从 Vivix CDN 缓冲的余量（秒）
  const segErr = () => r && r.segs && r.segs.some(s => s.status === 'error');
  const seg1Ok = () => r && r.segs && r.segs[0] && r.segs[0].url && srcOf(r.segs[0]).includes(V[0].dataset.src) && enough(V[0], 99, 25000) && (V[0]._dl != null || (V[0]._dl = (Date.now() - V[0]._tl) / 1000), true);
  const seg2Soon = () => { const s2 = r.segs[1]; if (!s2) return true;
    if (s2.url){ const d1 = (V[0].duration || r.segs[0].dur || 15) / RT.speed(), v = V[1]; if (!v._u0) v._u0 = Date.now();  // 11-05：第 2 段到了，按它实测的下载速度估：第 1 段播完前下得完才开播（宁可开头多等，不在中间停）；等 35 秒还估不出就照开
      return srcOf(s2).includes(v.dataset.src) && (bufEta(v) <= d1 - 2 || Date.now() - v._u0 > 35000); } const d1 = (V[0].duration || r.segs[0].dur || 5) / RT.speed(); return s2.eta_left != null && s2.eta_left + (V[0]._dl != null ? V[0]._dl : 8) <= d1 - M - (s2.dur >= 15 ? 1.5 : 0); };  // 11-05：再留出浏览器下载第 2 段的时间（按第 1 段实测的下载用时）
  await hold(null, () => (r && r.status === 'error') || segErr() || (seg1Ok() && seg2Soon()));
  if (my !== liveRun){ clearInterval(poll); return; }
  const view = {};
  if (!segErr() && r.status !== 'error'){
    $('liveWait').hidden = true; waitMusic(false); setMode('playing');
    view.play_at = Date.now(); view.seg2_eta = r.segs[1] ? r.segs[1].eta_left : null;
    RT.begin({key: 'round:' + rid, mix: r.mix, parts: r.segs.map((x, i) => ({v: V[i], d: x.dur || x.seconds})), label: T(`Scene ${round + 1}`, `第 ${round + 1} 幕`)}); RT.part(0);
    await play(0); view.seg1_end = Date.now();
    const ok2 = () => segErr() || (r.segs[1].url && srcOf(r.segs[1]).includes(V[1].dataset.src) && enough(V[1], 99, 15000));
    if (!ok2()){ waitMusic(true); while (!ok2() && my === liveRun) await new Promise(res => setTimeout(res, 100)); waitMusic(false); }  // 第 2 段还没到：停在第 1 段最后一帧
    view.stall = (Date.now() - view.seg1_end) / 1000;
    if (my === liveRun && !segErr()){ RT.part(1); await play(1); RT.done('round:' + rid); }
  }
  clearInterval(poll); view.end_at = Date.now(); $('liveWait').hidden = true;
  if (rid) api(`/api/round/${rid}/view`, view).catch(() => {});
  const gen = r.segs && r.segs.every(s => s.ready_at) ? Math.max(...r.segs.map(s => s.ready_at - r.director_at)) / 1000 : null;
  const dir = r.director_at ? (r.director_at - r.at) / 1000 : null;
  busy = false;
  if (!view.play_at || segErr()){ const low = (r.segs || []).some(s => s.err_code === 10005); setChip(low ? '<b>Vivix balance low</b> · this scene was not generated (10005). Top up the Vivix workspace, then choose or send again here' : `<b>This scene failed</b> · ${esc((r.segs || []).map(s => s.err).filter(Boolean)[0] || r.err || '')} · you can choose again`); if (low) toast(T('Vivix balance low', 'Vivix 余额不足')); openChoice(); return; }
  setChip(`<b>Scene ${round + 1}</b> · ${esc(r.mode)} · send to play ${((view.play_at - t0) / 1000).toFixed(1)}s (director ${dir == null ? '—' : dir.toFixed(1)}s${r.director === 'prefetched' ? ' prefetched' : ''} + part 1 ${r.segs[0].ready_at ? ((r.segs[0].ready_at - r.director_at) / 1000).toFixed(1) : '—'}s, part 2 ${gen == null ? '—' : gen.toFixed(1)}s) · seam pause ${(view.stall || 0).toFixed(1)}s`);
  const sceneNo = round + 1;
  replayFn = () => {  // 重看：看过了，可以随意拖；两段之间拖动时直接跳到那一段
    const go = (j, t) => { const v = V[j]; subsFor(j, v); v.currentTime = t; v.muted = false; v.loop = false; v.onended = () => { v.ontimeupdate = null; showSub(null); if (j + 1 < V.length){ RT.part(j + 1); go(j + 1, 0); } else { v.onended = null; RT.clear(); openChoice(); } }; v.play().then(() => show(v)).catch(() => {}); };
    RT.begin({key: 'round:' + rid, mix: r.mix, free: true, parts: r.segs.map((x, i) => ({v: V[i], d: x.dur || x.seconds})), label: T(`Scene ${sceneNo}`, `第 ${sceneNo} 幕`), jump: (j, t) => { V.forEach(x => { if (x !== V[j]){ x.pause(); x.onended = null; x.ontimeupdate = null; } }); go(j, t); }});
    go(0, 0);
  };
  round++; next = r.next || next; openChoice();

  function subLine(i, v){
    const Lns = (r.lines['seg' + (i + 1)] || []).filter(Boolean), Z = ((r.zh || {})['seg' + (i + 1)] || []).filter(Boolean), off = i === 1 ? 2 : 0;  // 第 2 段前 2 秒是静止承接
    return () => { const d = v.duration || r.segs[i].seconds; const LT = (r.line_times || {})['seg' + (i + 1)]; if (LT){ const c = LT.find(x => v.currentTime >= x.s && v.currentTime <= x.e); if (c) showSub({en: c.en, zh: c.zh || ''}, c.who === '她' ? T('Her', '她') : c.who); else showSub(null); } else if (Lns.length){ const t = Math.max(0, v.currentTime - off); const k = Math.min(Lns.length - 1, Math.floor(t / (d - off) * Lns.length)); showSub({en: Lns[k], zh: Z[k] || ''}, 'Rian'); } };
  }
  function subsFor(i, v){ const f = subLine(i, v); v.ontimeupdate = f; }
  function play(i){ return new Promise(res => {
    const v = V[i];
    v.dataset.started = rid; v.pause(); delete v.dataset.warm; try { v.playbackRate = v.defaultPlaybackRate || 1; } catch (e) {}  // 退出后台慢放，用回播放器选的倍速
    v.currentTime = 0; v.muted = false; v.loop = false; let done = false;
    const end = () => { if (done) return; done = true; v.ontimeupdate = null; showSub(null); res(); };
    const sub1 = subLine(i, v);
    v.ontimeupdate = () => { if (my !== liveRun){ end(); return; } sub1(); const d = v.duration || r.segs[i].seconds; if (d && v.currentTime >= d - 0.06) end(); };
    v.onended = end; v.onerror = end;
    v.play().then(() => show(v)).catch(() => { v.muted = true; v.play().then(() => show(v)).catch(end); });
  }); }
}
})();
</script>
